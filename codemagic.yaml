workflows:
  ios-signed-ota:
    name: EnsWilde Signed OTA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: ad_hoc # Hoặc development tùy cert mày mua
        bundle_identifier: app.lemon2974.peach9464 # SỬA LẠI ĐÚNG BUNDLE ID TRONG PROFILE CỦA MÀY
    scripts:
      - name: Build & Sign IPA
        script: |
          chmod +x ./scripts/build-ipa.sh
          bash ./scripts/build-ipa.sh Release
    artifacts:
      - build/ota/*.ipa
      - build/ota/*.plist
      - build/ota/*.html
    publishing:
      # Tự động đẩy thư mục build/ota lên GitHub Pages để lấy link HTTPS
      scripts:
        - name: Publish OTA to GitHub Pages
          script: |
            cd build/ota
            git init
            git config user.name "Codemagic Bot"
            git config user.email "bot@codemagic.io"
            git add .
            git commit -m "Deploy OTA"
            git push --force https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPO_OWNER/$GITHUB_REPO_NAME.git HEAD:gh-pages