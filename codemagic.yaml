workflows:
  ios-unsigned-build:
    name: EnsWilde Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
      # ĐÉO KHAI BÁO BẤT KỲ THÔNG TIN KÝ NÀO Ở ĐÂY
    scripts:
      - name: Build Unsigned IPA
        script: |
          chmod +x ./scripts/build-ipa.sh
          bash ./scripts/build-ipa.sh Release
    artifacts:
      - build/*.ipa