workflows:
  ios-signed-ota:
    name: EnsWilde Signed OTA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      ios_signing:
        # Nếu profile là Development thì đổi thành "development"
        # Nếu profile là Ad-Hoc (mua cert dài hạn) thì để "ad_hoc"
        distribution_type: development
        # CỰC KỲ QUAN TRỌNG: Phải KHỚP CHÍNH XÁC bundle ID trong profile
        bundle_identifier: com.yangjiii.EnsWilde
    scripts:
      - name: Apply Profile to Xcode Project
        script: |
          # Tự động set Provisioning Profile và Team vào project
          xcode-project use-profiles

      - name: Build & Sign IPA
        script: |
          chmod +x ./scripts/build-ipa.sh
          bash ./scripts/build-ipa.sh Release

    artifacts:
      - build/ota/*.ipa
      - build/ota/*.plist
      - build/ota/*.html
    publishing:
      scripts:
        - name: Publish OTA to GitHub Pages
          script: |
            cd build/ota
            git init
            git config user.name "Codemagic Bot"
            git config user.email "bot@codemagic.io"
            git add .
            git commit -m "Deploy OTA"
            git push --force https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPO_OWNER/$GITHUB_REPO_NAME.git HEAD:gh-pages