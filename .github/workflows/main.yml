name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true # Bắt buộc nếu có file .a nặng

      - name: Show Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build Unsigned IPA
        run: |
          chmod +x ./scripts/build-ipa.sh
          bash ./scripts/build-ipa.sh Release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EnsWilde-Build
          path: |
            build/EnsWilde.ipa
            build/EnsWilde.entitlements
          if-no-files-found: error